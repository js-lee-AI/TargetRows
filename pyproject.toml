[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "target-rows"
version = "0.2.0"
description = "Target-aware tree selection and GPU speculative decoding"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.23"]
authors = [{name = "Jungseob Lee"}]

[project.optional-dependencies]
gpu = ["torch>=2.7.1,<3", "transformers==4.53.1", "accelerate>=0.26,<2"]

[project.scripts]
target-rows = "target_rows.gpu:main"

[project.urls]
Repository = "https://github.com/js-lee-AI/TargetRows"

[tool.setuptools.packages.find]
include = ["target_rows*"]
